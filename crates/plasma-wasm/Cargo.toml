[package]
name = "plasma-wasm"
version = "0.1.0"
edition.workspace = true
license-file = "../../LICENSE.md"
description = "Host-driven Plasma agent sessions for WebAssembly environments"
repository = "https://github.com/tuist/plasma"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
plasma-inference = { path = "../plasma-inference" }
plasma-protocol = { path = "../plasma-protocol" }
plasma-session = { path = "../plasma-session" }
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

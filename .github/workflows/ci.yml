name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  build:
    name: Build (no warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build --verbose --all-targets
        env:
          RUSTFLAGS: -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --verbose --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- --deny warnings

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all -- --check

  wasm-package:
    name: WebAssembly package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: "rust node cargo:wasm-pack"
      - uses: Swatinem/rust-cache@v2
      - name: Add WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Build package
        run: mise run wasm:build
      - name: Exercise package in Node.js
        run: npm test --prefix packages/plasma
      - name: Verify package contents
        working-directory: packages/plasma
        run: npm pack --dry-run

  web:
    name: Web application
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: "rust node elixir erlang cargo:wasm-pack"
      - uses: Swatinem/rust-cache@v2
      - name: Add WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Install dependencies
        working-directory: web
        run: mix deps.get --check-locked
      - name: Test web application
        working-directory: web
        run: mix test
      - name: Build production assets
        working-directory: web
        run: MIX_ENV=prod mix assets.deploy
